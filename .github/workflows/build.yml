name: Native parity builds
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==4.4.4 ninja==1.13.0
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test shared behavior
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halftrack-${{ matrix.os }}
          path: |
            build/Halftrack_artefacts/Release/
            build/test-artifacts/
          retention-days: 14
